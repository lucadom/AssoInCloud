version: "3.8"

services:
  assoincloud:
    image: ghcr.io/lucadom/assoincloud:latest-dev
    container_name: assoincloud
    restart: unless-stopped
    ports:
      - "${ASSOINCLOUD_PORT:-80}:${SERVER_PORT:-8080}"
    environment:
      # Path to the SQLite database file inside the container.
      # The /data directory is mounted as a volume for persistence.
      ASSOINCLOUD_DB_PATH: "${ASSOINCLOUD_DB_PATH:-/data/assoincloud.db}"

      # Access password. When set, the application requires this password
      # to log in. When empty, no authentication is required.
      ASSOINCLOUD_PASSWORD: "${ASSOINCLOUD_PASSWORD:-}"

      # Root directory for document storage inside the container.
      ASSOINCLOUD_DOCUMENTS_ROOT: "${ASSOINCLOUD_DOCUMENTS_ROOT:-/data/documents}"

      # Internal Spring Boot port (normally you don't need to change this)
      SERVER_PORT: "${SERVER_PORT:-8080}"

      # JVM options (e.g. memory limits)
      JAVA_OPTS: "${JAVA_OPTS:--Xms128m -Xmx512m}"
    volumes:
      # Persistent storage for the SQLite database
      - assoincloud-data:/data

volumes:
  assoincloud-data:
    driver: local
