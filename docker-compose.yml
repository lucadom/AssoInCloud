version: "3.8"

services:
  assoincloud:
    image: ghcr.io/lucadom/assoincloud:latest-dev
    container_name: assoincloud
    restart: unless-stopped
    ports:
      - "${ASSOINCLOUD_PORT:-80}:80"
    environment:
      # Path to the SQLite database file inside the container.
      # The /data directory is mounted as a volume for persistence.
      ASSOINCLOUD_DB_PATH: "${ASSOINCLOUD_DB_PATH:-/data/assoincloud.db}"

      # Access password. When set, the application requires this password
      # to log in. When empty, no authentication is required.
      ASSOINCLOUD_PASSWORD: "${ASSOINCLOUD_PASSWORD:-}"

      # PEC inbox access via IMAP (read-only).
      # When ASSOINCLOUD_PEC_HOST is empty, the PEC page shows a "not configured" message.
      ASSOINCLOUD_PEC_HOST: "${ASSOINCLOUD_PEC_HOST:-}"
      ASSOINCLOUD_PEC_PORT: "${ASSOINCLOUD_PEC_PORT:-993}"
      ASSOINCLOUD_PEC_USERNAME: "${ASSOINCLOUD_PEC_USERNAME:-}"
      ASSOINCLOUD_PEC_PASSWORD: "${ASSOINCLOUD_PEC_PASSWORD:-}"
      ASSOINCLOUD_PEC_SSL: "${ASSOINCLOUD_PEC_SSL:-true}"
      # Set to true if the PEC provider uses a private CA not in the JRE trust store
      # (e.g. Legalmail/Infocert). Bypasses PKIX certificate chain validation.
      ASSOINCLOUD_PEC_SSL_TRUST_ALL: "${ASSOINCLOUD_PEC_SSL_TRUST_ALL:-false}"

      # Internal ports (normally you don't need to change these)
      SERVER_PORT: "${SERVER_PORT:-8080}"
      FRONTEND_PORT: "${FRONTEND_PORT:-3000}"

      # JVM options (e.g. memory limits)
      JAVA_OPTS: "${JAVA_OPTS:--Xms128m -Xmx512m}"
    volumes:
      # Persistent storage for the SQLite database
      - assoincloud-data:/data

volumes:
  assoincloud-data:
    driver: local
